<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI実験メモ アプリ一覧</title>
  <meta name="description" content="AI実験メモが作った静的Webアプリをまとめて紹介するページ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" fill-opacity="0.9">
        <path d="M12 2 L14.4 9.2 L22 9.6 L16 14.4 L18 22 L12 17.6 L6 22 L8 14.4 L2 9.6 L9.6 9.2 Z"/>
      </svg>
    </div>
    <div>
      <p class="brand-label">AI実験メモ</p>
      <h1>作ったアプリたち</h1>
      <p class="lead">AIと一緒に作った、無料で使える小さなツールをまとめました。</p>
    </div>
  </header>
  <main class="app-layout">
    <p class="page-lead">気になるアプリを見つけてタップしてね♪</p>
    <div id="app-list" class="app-grid"></div>

    <section class="home-screen-guide">
      <h2>📱 ホーム画面に追加すると便利です</h2>
      <p class="home-screen-guide-lead">このページをホーム画面に追加すると、アプリのように1タップで開けます。</p>
      <div class="home-screen-guide-cols">
        <div class="home-screen-guide-col">
          <h3>iPhone(Safari)</h3>
          <ol>
            <li>Safariでこのページを開く</li>
            <li>共有ボタン(四角に上矢印)をタップ</li>
            <li>「ホーム画面に追加」を選ぶ</li>
          </ol>
        </div>
        <div class="home-screen-guide-col">
          <h3>Android(Chrome)</h3>
          <ol>
            <li>Chromeでこのページを開く</li>
            <li>メニュー(縦三点)をタップ</li>
            <li>「ホーム画面に追加」を選ぶ</li>
          </ol>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
